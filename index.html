<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HeadsUp Middletown</title>
<meta name="description" content="A quick check on Middletown, DE: Frogtown train crossing, traffic, weather, road closures and what's new in town, live.">
<meta property="og:title" content="HeadsUp Middletown">
<meta property="og:description" content="What was that, and what's coming in Middletown, DE. A 5-second check.">
<meta property="og:image" content="logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b181d;--panel:#11242b;--panel2:#0e2026;--line:#1e3a44;--ink:#e6f1f3;--dim:#93adb4;--acc:#ff6b4a;
  --ok:#2ecc71;--warn:#f1c40f;--bad:#e74c3c;--idle:#5d7880}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Archivo,Inter,sans-serif;margin:0;line-height:1.15}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:12px max(4vw,14px) 32px}
header{display:flex;align-items:center;gap:12px;margin:6px 0 12px}
.logo{display:block;width:min(300px,62vw);height:auto}
.updated{margin-left:auto;text-align:right;font-size:12px;color:var(--dim)}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

/* Pinned announcements */
.pins{display:grid;gap:8px;margin-bottom:12px}
.pin{display:flex;align-items:center;gap:10px;background:#3a1410;border:1px solid #7a2a20;border-left:5px solid var(--bad);border-radius:12px;padding:10px 6px 10px 12px}
.pin a{flex:1;text-decoration:none;display:block}
.pin b{display:block;font-size:15px;line-height:1.3}
.pin small{color:#ffcdc4;font-size:12px}
.pin .x{flex:none;width:40px;height:40px;border:0;background:transparent;color:#ffcdc4;font-size:22px;cursor:pointer;border-radius:8px}
.more{border:1px dashed #7a2a20;background:transparent;color:#ffcdc4;border-radius:10px;padding:8px;cursor:pointer;font-size:14px}

/* New since last visit */
.since{font-size:14px;color:var(--dim);margin:0 0 10px}
.since b{color:var(--ink)}
.newdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-right:6px;vertical-align:1px}

/* Status board */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:560px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 14px;cursor:pointer;min-height:92px;border-left:5px solid var(--idle)}
.tile[aria-expanded=true]{border-color:var(--ink);border-left-color:inherit}
.tile .k{font-size:13px;color:var(--dim)}
.tile .v{display:block;font-family:Archivo,Inter,sans-serif;font-size:21px;font-weight:700;margin-top:2px;line-height:1.15}
.tile .s{display:block;font-size:12px;color:var(--dim);margin-top:3px}
.tile.ok{border-left-color:var(--ok)}.tile.warn{border-left-color:var(--warn)}.tile.bad{border-left-color:var(--bad)}
.tile .nd{position:absolute;top:10px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--acc)}

/* Expanded details */
.detail{grid-column:1/-1;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.detail h3{font-size:17px;margin-bottom:6px}
.detail ul{list-style:none;margin:0;padding:0}
.detail li{padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.detail li:first-child{border-top:0}
.detail li small{display:block;color:var(--dim);font-size:12px}
.detail .src{font-size:12px;color:var(--dim);margin-top:8px}
.link{background:none;border:0;padding:6px 0;color:var(--acc);cursor:pointer;font-weight:600;text-decoration:underline;font-size:14px}

/* Coming up + map */
.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.btn{flex:1;min-height:46px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:600}
.next{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.next h2{font-size:14px;color:var(--dim);font-family:Inter,sans-serif;font-weight:600;margin-bottom:4px}
.next li{display:flex;gap:12px;padding:5px 0;font-size:14px;border-top:1px dashed var(--line)}
.next li:first-child{border-top:0}
.next ul{list-style:none;margin:0;padding:0}
.next b{flex:none;width:5.2em;font-family:Archivo,Inter,sans-serif}
#mapbox{display:none;margin-top:12px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
#mapbox.on{display:block}
#map{height:min(60vh,440px);background:var(--panel2)}
.legend{font-size:12px;color:var(--dim);padding:8px 12px;background:var(--panel)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 4px 0 8px;vertical-align:0}
.darktiles{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6)}
footer{color:var(--dim);font-size:12px;margin-top:22px;border-top:1px solid var(--line);padding-top:12px}
.beta{font-size:12px;color:var(--dim);text-align:center;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="logo.webp" alt="HeadsUp Middletown" width="1400" height="525">
    <div class="updated" id="updated">Loading…</div>
  </header>

  <section class="pins" id="pins" aria-label="Announcements"></section>
  <p class="since" id="since"></p>

  <section class="board" id="board" aria-label="Middletown right now"></section>

  <div class="row">
    <button class="btn" id="mapbtn" aria-expanded="false">Show map &amp; live traffic</button>
  </div>
  <div id="mapbox">
    <div id="map" role="img" aria-label="Map of Middletown with live traffic"></div>
    <div class="legend">Traffic<span class="dot" style="background:#2ecc71"></span>moving<span class="dot" style="background:#f1c40f"></span>slow<span class="dot" style="background:#e74c3c"></span>jammed<span class="dot" style="background:#ffb86b"></span>Frogtown Crossing<span class="dot" style="background:#5fe0b0"></span>road advisory<span class="dot" style="background:#e0b48a"></span>new storefront</div>
  </div>

  <section class="next" id="next" aria-label="Coming up"></section>

  <footer>
    Sources: State Police, National Weather Service, DelDOT, TomTom, Delaware Open Data, OpenStreetMap. Not an emergency service. In an emergency, call 911.
    <div class="beta">Live test version</div>
  </footer>
</div>

<script>
{
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTime=t=>new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const fmtDay=t=>new Date(t).toLocaleDateString([],{month:'short',day:'numeric'});
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);return m<60?m+' min ago':m<1440?Math.round(m/60)+' hr ago':fmtDay(t)};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

const data={train:null,alerts:null,roads:null,business:null,urgent:null};
const lastVisit=store.get('hu_last',0);
let open=null, seeAll=false, showAllPins=false;
const dismissed=new Set(store.get('hu_dismissed',[]));
const isNew=t=>lastVisit&&t&&t>lastVisit;

// ---------- Pinned announcements ----------
function pinItems(){
  const out=[];
  for(const u of (data.urgent?.items||[])) out.push({id:u.link,t:u.title,link:u.link,src:u.source,time:u.time});
  for(const a of (data.alerts?.alerts||[])) if(/Warning|Emergency/i.test(a.event||'')||/Severe|Extreme/.test(a.severity||''))
    out.push({id:a.id,t:a.headline||a.event,link:'https://forecast.weather.gov/MapClick.php?lat=39.449&lon=-75.716',src:'National Weather Service',time:Date.parse(a.onset)||Date.now()});
  for(const r of (data.roads?.items||[])) if(r.kind==='crash'&&Date.now()-r.time<6*3600e3)
    out.push({id:r.id,t:'Crash: '+cap(r.where),link:`https://deldot.gov/map/?lat=${r.lat}&lon=${r.lon}`,src:'DelDOT',time:r.time});
  return out.filter(x=>!dismissed.has(x.id)).sort((a,b)=>b.time-a.time);
}
function renderPins(){
  const all=pinItems(), show=showAllPins?all:all.slice(0,3);
  $('pins').innerHTML=show.map(p=>`<div class="pin"><a href="${esc(p.link)}" target="_blank" rel="noopener"><b>${isNew(p.time)?'<span class="newdot"></span>':''}${esc(p.t)}</b><small>${esc(p.src)} · ${ago(p.time)} · tap for details</small></a><button class="x" data-dismiss="${esc(p.id)}" aria-label="Dismiss">×</button></div>`).join('')
    +(all.length>3&&!showAllPins?`<button class="more" id="morepins">+${all.length-3} more</button>`:'');
}

// ---------- Tiles ----------
const cap=s=>String(s||'').toLowerCase().replace(/(^|[\s(])\S/g,m=>m.toUpperCase());
function tiles(){
  const t=data.train, a=data.alerts, r=data.roads, b=data.business;
  const roads=r?.items||[], closures=roads.filter(x=>x.kind==='closure'), crashes=roads.filter(x=>x.kind==='crash'), jams=roads.filter(x=>x.kind==='traffic'||x.kind==='hazard');
  const stores=(b?.items||[]).filter(x=>x.kind==='storefront'), week=stores.filter(x=>Date.now()-x.licensed<7*864e5), month=stores.filter(x=>Date.now()-x.licensed<30*864e5);
  const warn=(a?.alerts||[]);
  const T={
    train:t?{cls:{clear:'ok',slow:'warn',likely_blocked:'bad',closed:'bad'}[t.status]||'',v:{clear:'Clear',slow:'Slow',likely_blocked:'Likely blocked',closed:'Closed'}[t.status]||'Unknown',s:`Broad St ${t.currentSpeed} mph (normal ${t.freeFlowSpeed})`}:{v:'…'},
    traffic:r?{cls:crashes.length?'bad':jams.length?'warn':'ok',v:crashes.length?crashes.length+' crash'+(crashes.length>1?'es':''):jams.length?'Some delays':'Moving',s:crashes.length||jams.length?'Tap for where':'No reported delays'}:{v:'…'},
    weather:a?{cls:warn.length?(warn.some(x=>/Warning/.test(x.event))?'bad':'warn'):'ok',v:warn.length?warn[0].event:'No alerts',s:warn.length>1?`+${warn.length-1} more`:'National Weather Service'}:{v:'…'},
    roads:r?{cls:closures.length?'warn':'ok',v:closures.length?closures.length+' closure'+(closures.length>1?'s':''):'All open',s:'Near Middletown'}:{v:'…'},
    sky:{cls:'',v:'Coming soon',s:'Helicopters & low planes'},
    new:b?{cls:month.length?'ok':'',v:month.length?month.length+' new spot'+(month.length>1?'s':''):'Nothing new',s:week.length?week.length+' this week':'Last 30 days'}:{v:'…'},
  };
  const newIn={
    train:false, traffic:crashes.some(x=>isNew(x.time)), weather:warn.some(x=>isNew(Date.parse(x.onset))),
    roads:closures.some(x=>isNew(x.time)), sky:false, new:stores.some(x=>isNew(x.licensed))};
  return {T,newIn,lists:{closures,crashes,jams,stores,warn}};
}
const LABEL={train:'Frogtown train crossing',traffic:'Traffic',weather:'Weather',roads:'Road closures',sky:'In the sky',new:'New in town'};
function detail(key,L){
  const lim=a=>seeAll?a:a.slice(0,3), more=a=>a.length>3&&!seeAll?`<button class="link" id="seeall">See all ${a.length}</button>`:'';
  const t=data.train;
  if(key==='train') return t?`<h3>Frogtown Crossing: ${esc({clear:'clear',slow:'slow traffic',likely_blocked:'likely blocked by a train',closed:'road closed'}[t.status]||'unknown')}</h3>
    <ul><li>N. Broad St approach is ${t.currentSpeed} mph (normal ${t.freeFlowSpeed})<small>Takes ${t.travelTime} s to get through (normal ${t.normalTravelTime} s) · checked ${fmtTime(t.checked)}</small></li>
    <li>Slow doesn't always mean a train; a backup or a red light looks the same.<small>Town code: a train may not block a Middletown street for more than 5 minutes.</small></li></ul><div class="src">Road speed from TomTom</div>`:'';
  if(key==='traffic'){const a=[...L.crashes,...L.jams];return `<h3>${a.length?'Reported delays':'Traffic is moving'}</h3>${a.length?`<ul>${lim(a).map(x=>`<li>${esc(cap(x.where))}<small>${esc(x.type)} · ${ago(x.time)}</small></li>`).join('')}</ul>${more(a)}`:'<ul><li>No crashes or official delays reported near Middletown.<small>Open the map for live red/yellow/green traffic.</small></li></ul>'}<div class="src">DelDOT advisories · live colors on the map</div>`;}
  if(key==='weather') return L.warn.length?`<h3>Weather alerts</h3><ul>${L.warn.map(x=>`<li>${esc(x.headline||x.event)}<small>${x.ends?'Until '+esc(new Date(x.ends).toLocaleString([],{weekday:'short',hour:'numeric',minute:'2-digit'})):''}</small></li>`).join('')}</ul><div class="src">National Weather Service</div>`:'<h3>No weather alerts</h3><ul><li>Nothing active for Middletown right now.</li></ul><div class="src">National Weather Service</div>';
  if(key==='roads') return L.closures.length?`<h3>Road closures nearby</h3><ul>${lim(L.closures).map(x=>`<li>${esc(cap(x.where))}<small>${esc(x.type)} · since ${fmtDay(x.time)} · <a href="https://deldot.gov/map/?lat=${x.lat}&lon=${x.lon}" target="_blank" rel="noopener">DelDOT map</a></small></li>`).join('')}</ul>${more(L.closures)}<div class="src">DelDOT</div>`:'<h3>No closures nearby</h3><div class="src">DelDOT</div>';
  if(key==='sky') return '<h3>Helicopters & low planes</h3><ul><li>Coming soon: a local receiver will show what\'s flying over town and why.</li></ul>';
  if(key==='new'){const s=L.stores;return s.length?`<h3>New storefronts in 19709</h3><ul>${lim(s).map(x=>`<li>${isNew(x.licensed)?'<span class="newdot"></span>':''}${esc(x.name||cap(x.category)+' (independent)')}<small>${esc(cap(x.category))} · ${esc(x.address||'')} · licensed ${fmtDay(x.licensed)}</small></li>`).join('')}</ul>${more(s)}<div class="src">State business licenses (new or renewed). New neighborhoods and big projects coming soon.</div>`:'<h3>Nothing new yet</h3>';}
  return '';
}
function renderBoard(){
  const {T,newIn,lists}=tiles();
  const keys=['train','traffic','weather','roads','new','sky'];
  let h='';
  for(const k of keys){
    const x=T[k];
    h+=`<button class="tile ${x.cls||''}" data-k="${k}" aria-expanded="${open===k}"><span class="k">${LABEL[k]}</span><span class="v">${esc(x.v)}</span><span class="s">${esc(x.s||'')}</span>${newIn[k]?'<i class="nd" aria-label="new"></i>':''}</button>`;
    // place the detail panel after the row that holds the open tile
    const cols=matchMedia('(max-width:560px)').matches?2:3, i=keys.indexOf(k);
    if(open&&((i+1)%cols===0||i===keys.length-1)){const oi=keys.indexOf(open);if(Math.floor(oi/cols)===Math.floor(i/cols))h+=`<div class="detail">${detail(open,lists)}</div>`;}
  }
  $('board').innerHTML=h;
  const cnt=Object.values(newIn).filter(Boolean).length+pinItems().filter(p=>isNew(p.time)).length;
  $('since').innerHTML=lastVisit?(cnt?`<span class="newdot"></span><b>${cnt} update${cnt>1?'s':''}</b> since your last visit (${ago(lastVisit)})`:`Nothing new since your last visit (${ago(lastVisit)})`):'Tap any box for details.';
}

// ---------- Coming up ----------
const NEXT=[['2026-11-26','Nov 26–27','Thanksgiving: no school'],['2026-12-07','Dec 7','Town council meeting, 7:30 PM'],['2026-12-23','Dec 23','Winter break starts'],['2027-01-04','Jan 4','Schools reopen'],['2027-03-26','Mar 26','Spring break starts']];
function renderNext(){
  const d=new Date().toISOString().slice(0,10), n=NEXT.filter(x=>x[0]>=d).slice(0,3);
  $('next').innerHTML=n.length?`<h2>Coming up</h2><ul>${n.map(x=>`<li><b>${x[1]}</b><span>${x[2]}</span></li>`).join('')}</ul>`:'';
}

// ---------- Map (loaded only when asked) ----------
let map=null, layers=null;
function loadLeaflet(){return new Promise((ok,no)=>{if(window.L)return ok();const c=document.createElement('link');c.rel='stylesheet';c.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(c);const s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function showMap(){
  await loadLeaflet();
  if(!map){
    map=L.map('map',{attributionControl:false}).setView([39.452,-75.716],13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,className:'darktiles'}).addTo(map);
    L.tileLayer('/tiles/flow/{z}/{x}/{y}.png',{opacity:.9,maxZoom:18,minZoom:9,zIndex:5}).addTo(map);
    layers=L.layerGroup().addTo(map);
  }
  drawMap(); setTimeout(()=>map.invalidateSize(),50);
}
function drawMap(){
  if(!map)return; layers.clearLayers();
  const s=data.train?.status, c=s==='likely_blocked'||s==='closed'?'#e74c3c':s==='slow'?'#f1c40f':'#ffb86b';
  L.circleMarker([39.4632,-75.7212],{radius:9,color:'#0b181d',weight:2,fillColor:c,fillOpacity:1}).addTo(layers).bindPopup('Frogtown Crossing');
  for(const r of (data.roads?.items||[])) if(r.lat!=null) L.circleMarker([r.lat,r.lon],{radius:7,color:'#0b181d',weight:2,fillColor:r.kind==='crash'?'#e74c3c':'#5fe0b0',fillOpacity:1}).addTo(layers).bindPopup(esc(cap(r.where)));
  for(const b of (data.business?.items||[])) if(b.kind==='storefront'&&b.lat!=null) L.circleMarker([b.lat,b.lon],{radius:6,color:'#0b181d',weight:2,fillColor:'#e0b48a',fillOpacity:1}).addTo(layers).bindPopup(esc(b.name||cap(b.category)));
}

// ---------- Data ----------
function render(){renderPins();renderBoard();renderNext();drawMap();$('updated').textContent='Updated '+fmtTime(Date.now())}
async function load(name){try{const r=await fetch('/api/'+name,{cache:'no-store'});if(r.ok)data[name]=await r.json()}catch(e){}render()}
const every={train:240000,alerts:300000,roads:180000,business:3600000,urgent:180000};
for(const [k,ms] of Object.entries(every)){load(k);setInterval(()=>{if(!document.hidden)load(k)},ms)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)store.set('hu_last',Date.now());else{load('train');load('urgent')}});
addEventListener('pagehide',()=>store.set('hu_last',Date.now()));

// ---------- Events ----------
$('board').addEventListener('click',e=>{
  if(e.target.id==='seeall'){seeAll=true;renderBoard();return}
  const t=e.target.closest('.tile');if(!t)return;
  open=open===t.dataset.k?null:t.dataset.k;seeAll=false;renderBoard();
  if(open==='traffic'&&!$('mapbox').classList.contains('on')){}
});
$('pins').addEventListener('click',e=>{
  const x=e.target.closest('[data-dismiss]');if(x){dismissed.add(x.dataset.dismiss);store.set('hu_dismissed',[...dismissed].slice(-50));renderPins();renderBoard();return}
  if(e.target.id==='morepins'){showAllPins=true;renderPins()}
});
$('mapbtn').addEventListener('click',async()=>{
  const box=$('mapbox'),on=!box.classList.contains('on');box.classList.toggle('on',on);
  $('mapbtn').setAttribute('aria-expanded',on);$('mapbtn').textContent=on?'Hide map':'Show map & live traffic';
  if(on) showMap().catch(()=>{$('map').textContent='Map couldn\'t load.'});
});
addEventListener('resize',()=>{if(open)renderBoard()});
render();
}
</script>
</body>
</html>
